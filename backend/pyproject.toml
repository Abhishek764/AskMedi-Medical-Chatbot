[project]
name = "askmedi-backend"
version = "2.0.0.dev0"
description = "AskMedi v2 backend: FastAPI API, guarded hybrid RAG, ingestion"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pyjwt>=2.8",
    "argon2-cffi>=23.1",
    "redis>=5.0",
    "httpx>=0.27",
    "qdrant-client>=1.12",
    "pypdf>=5.0",
    "arq>=0.26",
    "defusedxml>=0.7.1",
    "bcrypt>=5.0.0",
    "sentry-sdk[fastapi]>=2.10",
]

[project.optional-dependencies]
# Free local models (ONNX, no torch): dense embeddings + cross-encoder rerank.
local = ["fastembed>=0.4"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "asgi-lifespan>=2.1",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101", "B008", "E501"]  # ruff format owns line length

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
"migrations/**" = ["E501"]
"scripts/**" = ["S311"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
