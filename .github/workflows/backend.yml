name: backend

on:
  pull_request:
    paths: ["backend/**", "evals/ci/**", "data/corpus/**", ".github/workflows/backend.yml"]
  push:
    branches: [main]
    paths: ["backend/**", "evals/ci/**", "data/corpus/**", ".github/workflows/backend.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check app tests && uv run ruff format --check app tests
      - name: Tests (guards, auth, retrieval, pipeline; no secrets needed)
        run: uv run pytest --cov=app --cov-report=term-missing:skip-covered
      - name: Migrations apply cleanly
        env:
          DATABASE_URL: sqlite+aiosqlite:///./ci.db
        run: uv run alembic upgrade head && uv run alembic check
      - name: Dependency audit
        run: uvx pip-audit --strict --progress-spinner off -r <(uv export --frozen --no-dev --no-hashes)
        continue-on-error: true

  eval:
    # Runs the real pipeline (free local models) on evals/ci/ and fails on any regression:
    # retrieval recall, cited answers, 100% safety on held-out rows, medicine-check routing.
    runs-on: ubuntu-latest
    needs: test
    env:
      EMBEDDINGS_PROVIDER: fastembed
      RERANK_PROVIDER: fastembed
      LLM_PROVIDER: extractive
      FASTEMBED_CACHE_PATH: /home/runner/.cache/fastembed
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/cache@v4
        with:
          path: /home/runner/.cache/fastembed
          key: fastembed-bge-small-minilm-v1
      - run: uv sync --frozen --extra local
      - name: Eval gate
        run: uv run python -m app.eval_ci
